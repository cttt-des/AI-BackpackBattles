# 背包乱斗 AI 机器人配置文件（外置模式）
# 无需修改游戏文件，纯外置运行

game:
  max_rounds: 18
  action_delay: 0.2       # 操作间隔（秒）
  combat_timeout: 120     # 战斗超时（秒）
  window_title: "Backpack Battles"

ai:
  strategy: "heuristic"   # heuristic | llm
  
  # 启发式策略配置
  heuristic:
    buy_priority: "cheapest_first"   # cheapest_first | highest_value | balanced
    prefer_weapons: true
    max_rerolls_per_round: 2
    auto_sell_junk: true
    fill_backpack: true
  
  # LLM 策略配置（预留）
  llm:
    provider: "openai"    # openai | anthropic | local
    model: "gpt-4"
    api_key: ""           # 从环境变量 OPENAI_API_KEY 获取
    api_base: ""
    temperature: 0.3
    max_tokens: 500

memory:
  scan_on_start: true
  refresh_interval: 0.5   # 内存刷新间隔（秒）

# Godot 结构性读取（免手动校准）
# 用 tools/probe_godot.py 一次性标定后，把 os_singleton_rva / game_child_index /
# member_gold / member_hp / member_round 填到这里即可长期自动读取。
# os_singleton_rva 为 0 表示未标定，将回退到 GUI 里的「内存校准」面板手动标定。
godot:
  # os_singleton_rva=0 表示启动时自动扫描定位（本机实测 0x1eba290，
  # 但不同游戏版本 RVA 会变，故默认自动发现）。
  os_singleton_rva: 0x1eba290
  # Game 单例首选按脚本路径 BFS 定位；实测 Game = root.children[8]（兜底用）。
  game_child_index: 8
  game_script_path: "res://Core/Game.gd"
  game_node_name: "Game"
  bfs_max_depth: 6
  # 2026-07-26 活体标定（金币13/生命5/回合1）：[72]=gold [68]=hp [65]=round
  member_gold: 72
  member_hp: 68
  member_round: 65
    
  os_main_loop_off: 0x1D0
  scenetree_root_off: 0x148     # 真 root 视口(name='root'，含18个autoload)；0x230 是 current_scene
  object_script_instance_off: 0x58
  node_parent_off: 0xF0         # 0x8 是误判；真 root 的 parent 在 0xf0 且为 null
  node_children_off: 0x108      # children = Vector<Node*>(CowData)；0x6c0 是画布项表(误)
  node_name_off: 0x130          # StringName 字段；_Data 内 String 偏移见下
  stringname_data_str_off: 0x10
  gdscript_script_off: 0x10
  gdscript_members_off: 0x20
  variant_size: 24
  cowdata_size_back_off: 4       # Vector 元素个数在 _ptr-4（uint32）

dashboard:
  host: "127.0.0.1"
  port: 8080
  auto_open: true         # 自动打开浏览器
